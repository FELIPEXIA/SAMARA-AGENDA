<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1e2a"/>
      <stop offset="50%" stop-color="#11131a"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fceddf"/>
      <stop offset="30%" stop-color="#e3a283"/>
      <stop offset="70%" stop-color="#b87153"/>
      <stop offset="100%" stop-color="#844830"/>
    </linearGradient>

    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fdf1dc"/>
      <stop offset="80%" stop-color="#df9e7e"/>
      <stop offset="100%" stop-color="#9a5a3f"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="transparent"/>
      <stop offset="96%" stop-color="#df9e7e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#df9e7e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fundo Circular Elegante -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)"/>
  
  <!-- Brilho Periférico -->
  <circle cx="256" cy="256" r="248" fill="url(#ringGlow)"/>

  <!-- Anel Externo Rose Gold -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#roseGold)" stroke-width="6" opacity="0.9"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#roseGold)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Monograma Central 'S' Estilizado Luxo -->
  <g filter="url(#softGlow)">
    <!-- Letra S em traçado elegante de alta costura -->
    <path d="M 320 178 C 315 145, 290 120, 252 120 C 205 120, 172 152, 172 195 C 172 232, 196 256, 238 274 L 270 288 C 312 306, 334 332, 334 372 C 334 422, 295 456, 246 456 C 196 456, 162 420, 158 376" 
          fill="none" 
          stroke="url(#goldShine)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Ponto de Luz / Brilho Diamante Superior Direito -->
  <g transform="translate(356, 128)">
    <path d="M 0 -26 Q 0 0 26 0 Q 0 0 0 26 Q 0 0 -26 0 Q 0 0 0 -26 Z" fill="#fff" opacity="0.95"/>
    <circle cx="0" cy="0" r="5" fill="#fceddf"/>
  </g>

  <!-- Estrela Menor Esquerda Inferior -->
  <g transform="translate(138, 360)">
    <path d="M 0 -14 Q 0 0 14 0 Q 0 0 0 14 Q 0 0 -14 0 Q 0 0 0 -14 Z" fill="#e3a283" opacity="0.8"/>
  </g>

  <!-- Subtítulo "STUDIO" -->
  <text x="256" y="420" 
        text-anchor="middle" 
        fill="#fceddf" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="28" 
        letter-spacing="12" 
        font-weight="600"
        opacity="0.85">STUDIO</text>
</svg>
